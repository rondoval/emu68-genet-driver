[pytest]
testpaths = unit logic gates
addopts = -ra --strict-markers --timeout=900
timeout_func_only = true
markers =
    unit: the harness's own parsers and judgements, on recorded outputs
    logic: the driver's own sources built as m68k programs and run on the host under vamos (tests/logic/)
    gates: kernel-doc, complexity and traceability over the component's own files (run.sh host)
    hw: on the Amiga (run.sh hw), after the user agreed to the round
    install: the build installed and checked in place (run.sh hw --tier install; also part of smoke)
    smoke: the hardware tier that installs, brings up both personalities and moves a little data
    full: the hardware tier with every claim rule, refusal, filter, prefs key and the bsdsocktest suite (run with smoke)
    perf: the hardware tier with sockbench's matrix and Executive's CPU share against baselines.json
    compare: the hardware tier that judges the build against a reference driver on alternating boots
    profile: the hardware tier with a profile build's per-call costs off the serial line
    personality(kind, last=False, boot=False): genet up as TYPE=kind (AUTO, NETDEV, SANA2) before the test; last: after the others of that personality; boot: on a boot of its own, once per session
    covers(*items): what the test covers (TRACEABILITY.md)
